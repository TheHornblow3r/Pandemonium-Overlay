<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      opacity: 1;
      transition: opacity 350ms ease-out;
      position: relative;
    }

    body.fade-out {
      opacity: 0;
    }

    img {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

  .version {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    font-family: Arial, sans-serif;
    color: #ffffff;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  </style>
</head>
<body>
  <img src="assets/splash.png" alt="Pandemonium Overlay Splash" />

  <div class="version" id="version">v0.0.0</div>

  <script>
    const { ipcRenderer } = require('electron');

    // Receive version from main process
    ipcRenderer.on('splash-version', (_, version) => {
      document.getElementById('version').innerText = `v${version}`;
    });

    // Fade-out trigger
    ipcRenderer.on('fade-out', () => {
      document.body.classList.add('fade-out');

      setTimeout(() => {
        ipcRenderer.send('splash-faded');
      }, 350);
    });
  </script>
</body>
</html>
