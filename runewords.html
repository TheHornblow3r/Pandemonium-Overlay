<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Runewords</title>

  <style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

    body {
      margin: 0;
      background: rgba(15, 15, 15, 0.95);
      color: #ddd;
      font-family: Arial, sans-serif;
      font-size: 12px;
      user-select: none;
      overflow-x: hidden;
      padding: 12px;
    }

    .container {
      padding: 8px;
      -webkit-app-region: drag;
    }

    #search {
      width: 100%;
      padding: 6px;
      margin-bottom: 6px;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      outline: none;
      -webkit-app-region: no-drag;
      pointer-events: auto;
    }

    #filters {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    #filters button {
      background: #1e1e1e;
      border: 1px solid #333;
      color: #ccc;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
    }

    #filters button.active {
      color: #ff9f43;
      border-color: #ff9f43;
    }

    #filters button:hover {
      background: #2a2a2a;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px;
    }

    .title {
      color: #ff9f43;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .subtitle {
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 8px;
  }

    .bases {
      color: #aaa;
      font-size: 11px;
      margin-bottom: 2px;
    }

    .runes {
      color: #b8860b;
      margin-bottom: 4px;
    }

    .stats div {
      line-height: 1.3;
    }

    .pod-stat {
      color: #3cff00;
    }
    .title-bar {
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      text-align: center;
    }
    /* Scrollbar width */
    ::-webkit-scrollbar {
      width: 8px;
    }

    /* Track */
    ::-webkit-scrollbar-track {
      background: #111;
    }

    /* Handle */
    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    /* Handle on hover */
    ::-webkit-scrollbar-thumb:hover {
      background: #666;
    }
    .window-controls {
  display: flex;
  justify-content: flex-end;
  align-items: center;

  height: 18px;
  padding: 0 6px;



  -webkit-app-region: drag;
}

.close-btn {
  background: none;
  border: none;
  color: #aaa;
  font-size: 12px;
  cursor: pointer;
  padding: 0 4px;

  -webkit-app-region: no-drag;
}

.close-btn:hover {
  color: #ff5c5c;
}
.level-req {
  font-size: 11px;
  color: #aaa;
  margin-bottom: 4px;
}
/* Remove number input arrows (Chrome, Edge, Safari) */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  appearance: none;
  margin: 0;
}

/* Remove number input arrows (Firefox) */
input[type="number"] {
  -moz-appearance: textfield;
  appearance: textfield;
}


  </style>
</head>

<body>
  <div class="window-controls">
  <button class="close-btn" onclick="closeOverlay()">✕</button>
</div>
  <div class="container">
    <div class="title-bar">Runewords</div>
    <div class="subtitle">Path of Diablo Runewords</div>
  </div>

    <div style="display:flex; gap:6px; margin-bottom:6px;">
  <input
    id="search"
    placeholder="Search runewords, runes, stats..."
    style="flex:1;"
  />

  <input
    id="levelFilter"
    type="number"
    min="1"
    max="99"
    placeholder="Lvl"
    title="Character level"
    style="
      width:60px;
      background:#1e1e1e;
      border:1px solid #333;
      color:#fff;
      border-radius:4px;
      padding:6px;
    "
  />
</div>


    <div id="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="helm">Helm</button>
      <button data-filter="weapon">Weapon</button>
      <button data-filter="melee">Melee</button>
      <button data-filter="missile">Missile</button>          
      <button data-filter="armor">Armor</button>
      <button data-filter="shield">Shield</button>
      <button data-filter="club">Club</button>
      <button data-filter="mace">Mace</button>
      <button data-filter="hammer">Hammer</button>
      <button data-filter="claw">Claw</button>
      <button data-filter="axe">Axe</button>
      <button data-filter="sword">Sword</button>
      <button data-filter="spear">Spear</button>
      <button data-filter="polearm">Polearm</button>
      <button data-filter="staff">Staff</button>
      <button data-filter="wand">Wand</button>
      <button data-filter="scepter">Scepter</button>   
    </div>

    <div id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('search');
    const filterButtons = document.querySelectorAll('#filters button');
    const levelInput = document.getElementById('levelFilter');

    levelInput.addEventListener('input', applyFilters);
    



    let cards = [];
    let activeFilter = 'all';

function applyFilters() {
  const query = searchInput.value.toLowerCase().trim();
  const maxLevel = parseInt(levelInput.value, 10) || null;

  // 🧠 Sort cards so usable ones come first (only if level is set)
  if (maxLevel !== null) {
    cards.sort((a, b) => {
      const aLevel = parseInt(a.dataset.level, 10) || 0;
      const bLevel = parseInt(b.dataset.level, 10) || 0;

      const aUsable = aLevel <= maxLevel;
      const bUsable = bLevel <= maxLevel;

      // usable first
      if (aUsable && !bUsable) return -1;
      if (!aUsable && bUsable) return 1;

      // otherwise keep original order
      return 0;
    });

    // re-append cards in new order
    cards.forEach(card => grid.appendChild(card));
  }

  cards.forEach(card => {
    const textMatch =
      !query || card.dataset.search.includes(query);

    const cardLevel = parseInt(card.dataset.level, 10) || 0;
    const levelMatch =
      maxLevel === null || cardLevel <= maxLevel;

    const bases = card.dataset.bases || '';
    const baseMatch =
      activeFilter === 'all' || bases.includes(activeFilter);

    // ❌ Hard filters
    if (!textMatch || !baseMatch) {
      card.style.display = 'none';
      return;
    }

    // ✅ Show card
    card.style.display = '';

    // 🎯 Grey out if above character level
    if (!levelMatch) {
      card.style.opacity = '0.35';
      card.style.pointerEvents = 'none';
    } else {
      card.style.opacity = '';
      card.style.pointerEvents = '';
    }
  });
}




    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        activeFilter = btn.dataset.filter;
        applyFilters();
      });
    });

    searchInput.addEventListener('input', applyFilters);

    fetch('./runewords.json')
      .then(res => res.json())
      .then(data => {
        Object.entries(data).forEach(([name, rw]) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.bases = (rw.bases || []).map(b => b.toLowerCase()).join(' ');
          card.dataset.level = rw.level || 0;


          const bases = (rw.bases || []).map(b => b.toLowerCase());
          card.dataset.bases = bases.join(',');

          const podStats = rw.stats?.pod || [];
          const vanillaStats = rw.stats?.vanilla || [];

          const searchableText = [
            name,
            `level ${rw.level || ''}`,
            rw.bases?.join(' ') || '',
            rw.runes?.join(' ') || '',
            podStats.join(' '),
            vanillaStats.join(' ')
          ].join(' ').toLowerCase();

          card.dataset.search = searchableText;

          card.innerHTML = `
            <div class="title">${name}</div>

            ${rw.level ? `<div class="level-req">Level Required: ${rw.level}</div>` : ''}

            <div class="bases">${(rw.bases || []).join(' / ')}</div>
            <div class="runes">${(rw.runes || []).join(' + ')}</div>

            <div class="stats">
              ${vanillaStats.map(s => `<div>${s}</div>`).join('')}
              ${podStats.map(s => `<div class="pod-stat">${s}</div>`).join('')}
            </div>
          `;


          cards.push(card);
          grid.appendChild(card);
        });

        applyFilters();
      })
      .catch(err => console.error('Failed to load runewords.json', err));

    const tabs = document.querySelectorAll('.tab');

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    const base = tab.dataset.base;

    cards.forEach(card => {
      if (base === 'all') {
        card.style.display = '';
      } else {
        card.style.display = card.dataset.bases.includes(base)
          ? ''
          : 'none';
      }
    });
  });
});
  
function closeOverlay() {
  const { ipcRenderer } = require('electron');
  ipcRenderer.send('close-current-window');
}
  </script>
</body>
</html>
