<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Runewords</title>

  <style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

    body {
      margin: 0;
      background: rgba(15, 15, 15, 0.95);
      color: #ddd;
      font-family: Arial, sans-serif;
      font-size: 12px;
      user-select: none;
      overflow-x: hidden;
      padding: 12px;
    }

    .container {
      padding: 8px;
      -webkit-app-region: drag;
    }

    #search {
      width: 100%;
      padding: 6px;
      margin-bottom: 6px;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      outline: none;
      -webkit-app-region: no-drag;
      pointer-events: auto;
    }

    #filters {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    #filters button {
      background: #1e1e1e;
      border: 1px solid #333;
      color: #ccc;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
    }

    #filters button.active {
      color: #ff9f43;
      border-color: #ff9f43;
    }

    #filters button:hover {
      background: #2a2a2a;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px;
    }

    .title {
      color: #ff9f43;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .subtitle {
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 8px;
  }

    .bases {
      color: #aaa;
      font-size: 11px;
      margin-bottom: 2px;
    }

    .runes {
      color: #b8860b;
      margin-bottom: 4px;
    }

    .stats div {
      line-height: 1.3;
    }

    .pod-stat {
      color: #3cff00;
    }
    .title-bar {
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      text-align: center;
    }
    /* Scrollbar width */
    ::-webkit-scrollbar {
      width: 8px;
    }

    /* Track */
    ::-webkit-scrollbar-track {
      background: #111;
    }

    /* Handle */
    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    /* Handle on hover */
    ::-webkit-scrollbar-thumb:hover {
      background: #666;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title-bar">Runewords</div>
    <div class="subtitle">Path of Diablo Runewords</div>
  </div>

    <input id="search" placeholder="Search runewords, runes, stats..." />

    <div id="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="helm">Helm</button>
      <button data-filter="weapon">Weapon</button>
      <button data-filter="melee">Melee</button>
      <button data-filter="missile">Missile</button>          
      <button data-filter="armor">Armor</button>
      <button data-filter="shield">Shield</button>
      <button data-filter="club">Club</button>
      <button data-filter="mace">Mace</button>
      <button data-filter="hammer">Hammer</button>
      <button data-filter="claw">Claw</button>
      <button data-filter="axe">Axe</button>
      <button data-filter="sword">Sword</button>
      <button data-filter="spear">Spear</button>
      <button data-filter="polearm">Polearm</button>
      <button data-filter="staff">Staff</button>
      <button data-filter="wand">Wand</button>
      <button data-filter="scepter">Scepter</button>   
    </div>

    <div id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('search');
    const filterButtons = document.querySelectorAll('#filters button');

    let cards = [];
    let activeFilter = 'all';

    function applyFilters() {
      const query = searchInput.value.toLowerCase();

      cards.forEach(card => {
        const matchesSearch = card.dataset.search.includes(query);
        const bases = card.dataset.bases || '';

        const matchesFilter =
          activeFilter === 'all' ||
          bases.includes(activeFilter);

        card.style.display =
          matchesSearch && matchesFilter ? '' : 'none';
      });
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        activeFilter = btn.dataset.filter;
        applyFilters();
      });
    });

    searchInput.addEventListener('input', applyFilters);

    fetch('./runewords.json')
      .then(res => res.json())
      .then(data => {
        Object.entries(data).forEach(([name, rw]) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.bases = (rw.bases || []).map(b => b.toLowerCase()).join(' ');


          const bases = (rw.bases || []).map(b => b.toLowerCase());
          card.dataset.bases = bases.join(',');

          const podStats = rw.stats?.pod || [];
          const vanillaStats = rw.stats?.vanilla || [];

          const searchableText = [
            name,
            rw.bases?.join(' ') || '',
            rw.runes?.join(' ') || '',
            podStats.join(' '),
            vanillaStats.join(' ')
          ].join(' ').toLowerCase();

          card.dataset.search = searchableText;

          card.innerHTML = `
            <div class="title">${name}</div>
            <div class="bases">${(rw.bases || []).join(' / ')}</div>
            <div class="runes">${(rw.runes || []).join(' + ')}</div>
            <div class="stats">
              ${vanillaStats.map(s => `<div>${s}</div>`).join('')}
              ${podStats.map(s => `<div class="pod-stat">${s}</div>`).join('')}
            </div>
          `;

          cards.push(card);
          grid.appendChild(card);
        });

        applyFilters();
      })
      .catch(err => console.error('Failed to load runewords.json', err));

    const tabs = document.querySelectorAll('.tab');

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    const base = tab.dataset.base;

    cards.forEach(card => {
      if (base === 'all') {
        card.style.display = '';
      } else {
        card.style.display = card.dataset.bases.includes(base)
          ? ''
          : 'none';
      }
    });
  });
});
  
  </script>
</body>
</html>
